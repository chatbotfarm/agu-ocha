<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Suno Vibez — submit a track</title>
  <!-- Backward-compatibility stub for /suno-vibez/ and /suno-vibez. Forwards to
       the canonical slug (spec §11.3). Relative "../" keeps the site portable
       to project-page hosting; only the canonical tag is absolute. -->
  <meta http-equiv="refresh" content="0; url=../submit.html">
  <meta name="robots" content="noindex, follow">
  <link rel="canonical" href="https://aguocha.com/submit">
  <link rel="icon" href="../favicon.ico">
  <style>
    :root{--jet:#0B0B0C;--leopard:#F7F7F8;--brand:#D41414}
    html{font-size:17px}
    body{background:var(--jet);color:var(--leopard);line-height:1.65}
    .btn-primary{background:var(--brand);color:var(--leopard);border-color:transparent}
    .btn-primary:hover{background:var(--leopard);color:var(--jet)}
    :focus-visible{outline:2px solid var(--leopard);outline-offset:3px}
  </style>
  <!-- Compiled Tailwind. Loaded LAST on purpose: the Play CDN this replaced
       appended its generated stylesheet to the end of <head>, so utilities won
       every specificity tie against the project classes above. That is also
       Tailwind's intended cascade — `class="section pt-10"` is written
       expecting pt-10 to win. Moving this link higher silently changes
       line-height, section padding and card borders sitewide. -->
  <link rel="stylesheet" href="../assets/tailwind.css">
</head>
<body>
  <main class="mx-auto max-w-xl px-4 py-16 text-center">
    <h1 class="font-extrabold text-2xl">Suno Vibez</h1>
    <p class="mt-3 text-white/80">Taking you to the submission page&hellip;</p>
    <p class="mt-6">
      <a class="btn-primary inline-block rounded-xl px-5 py-3 font-semibold" href="../submit.html">
        Submit your track
      </a>
    </p>
  </main>
  <script>location.replace("../submit.html");</script>
</body>
</html>
