<!-- Shared header fragment. Injected into #site-header by assets/site.js.
     Note: <script> inside an innerHTML-injected fragment never executes, which
     is why all nav behavior is delegated from assets/site.js and hooked up via
     the data-nav-toggle / data-nav-close attributes below. A <style> element,
     unlike a <script>, DOES apply when injected this way - so the shared focus
     styles for the header and footer live here, in one place, rather than being
     duplicated across every page's inline <style> block. -->
<style>
  header a:focus-visible,
  header button:focus-visible,
  footer a:focus-visible{
    outline:2px solid #F7F7F8;
    outline-offset:3px;
    border-radius:.375rem;
  }
</style>

<header class="sticky top-0 z-50 border-b border-white/10 bg-black/40 backdrop-blur">
  <div class="mx-auto flex max-w-7xl flex-wrap items-center justify-between gap-y-3 px-4 py-4">
    <!-- Left Logo -->
    <a href="/" class="flex items-center gap-3" aria-label="Home">
      <img src="/img/agu-logo.png" alt="Agu Ocha logo" class="h-10 w-10 rounded-full border border-white/10 object-cover">
      <span class="font-bold tracking-wide">Agu Ocha</span>
    </a>

    <!-- DESKTOP NAV -->
    <nav class="hidden items-center gap-6 font-medium lg:flex" aria-label="Primary"><a href="https://aguocha.com/#events">Events</a><a href="https://aguocha.com/pass-the-mic.html">Pass the Mic</a><a href="https://aguocha.com/bubble-house.html">Bubble House</a><a class="btn-primary whitespace-nowrap rounded-xl px-4 py-2 font-semibold" href="https://aguocha.com/booking/">Book a call <span aria-hidden="true">↗</span></a></nav>
    <!-- Mobile nav toggle -->
    <button type="button"
            class="inline-flex rounded-lg border border-white/15 px-3 py-2 lg:hidden"
            data-nav-toggle
            aria-controls="mobile-nav"
            aria-expanded="false"
            aria-label="Menu">
      <span class="font-mono text-lg" aria-hidden="true">≡</span>
    </button>
  </div>

  <!-- MOBILE NAV -->
  <div id="mobile-nav" class="hidden border-t border-white/10 bg-black/60 lg:hidden">
    <nav class="mx-auto grid max-w-7xl gap-3 px-4 py-4 text-lg" aria-label="Primary (mobile)"><a data-nav-close href="https://aguocha.com/#events">Events</a><a data-nav-close href="https://aguocha.com/pass-the-mic.html">Pass the Mic</a><a data-nav-close href="https://aguocha.com/bubble-house.html">Bubble House</a><a data-nav-close class="btn-primary whitespace-nowrap rounded-xl px-4 py-2 font-semibold" href="https://aguocha.com/booking/">Book a call <span aria-hidden="true">↗</span></a></nav>
  </div>
</header>
