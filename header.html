<!-- Shared header fragment. Injected into #site-header by assets/site.js.
     Note: <script> inside an innerHTML-injected fragment never executes, which
     is why all nav behavior is delegated from assets/site.js and hooked up via
     the data-nav-toggle / data-nav-close attributes below. A <style> element,
     unlike a <script>, DOES apply when injected this way - so the shared focus
     styles for the header and footer live here, in one place, rather than being
     duplicated across every page's inline <style> block. -->
<style>
  header a:focus-visible,
  header button:focus-visible,
  footer a:focus-visible{
    outline:2px solid #F7F7F8;
    outline-offset:3px;
    border-radius:.375rem;
  }
</style>

<header class="sticky top-0 z-50 border-b border-white/10 bg-black/40 backdrop-blur">
  <div class="mx-auto flex max-w-7xl flex-wrap items-center justify-between gap-y-3 px-4 py-4">
    <!-- Left Logo -->
    <a href="index.html" class="flex items-center gap-3" aria-label="Home">
      <img src="img/agu-logo.png" alt="Agu Ocha logo" class="h-10 w-10 rounded-full border border-white/10 object-cover">
      <span class="font-bold tracking-wide">Agu Ocha</span>
    </a>

    <!-- DESKTOP NAV -->
    <nav class="hidden items-center gap-6 font-medium lg:flex" aria-label="Primary">
      <a href="music.html">Music</a>

      <!-- Book dropdown. A CSS disclosure, not a JS menu widget: it opens on
           hover, on trigger focus (peer-focus) and on focus inside
           (focus-within), so every destination is keyboard reachable.
           Deliberately carries no aria-haspopup/aria-expanded/role="menuitem" —
           nothing here updates aria-expanded, so declaring it would report a
           permanently false state, and role="menuitem" is invalid without a
           role="menu" parent. Plain links are correct and are announced
           correctly. Every destination below is also listed in the mobile menu,
           in the footer, and on book.html, so none is hover-only. -->
      <div class="relative group">
        <!-- focusable trigger -->
        <a href="book.html" class="peer inline-flex items-center gap-1">
          Book <span aria-hidden="true">▾</span>
        </a>

        <!-- dropdown menu -->
        <div
          class="absolute right-0 top-full z-50 w-72 rounded-xl border border-white/10
                 bg-black/70 backdrop-blur p-2
                 opacity-0 scale-95 pointer-events-none
                 transition duration-150 ease-out
                 group-hover:opacity-100 group-hover:scale-100 group-hover:pointer-events-auto
                 peer-focus:opacity-100 peer-focus:scale-100 peer-focus:pointer-events-auto
                 focus-within:opacity-100 focus-within:scale-100 focus-within:pointer-events-auto">
          <a href="private-corporate.html" class="block rounded-lg px-3 py-2 hover:bg-white/10">
            Private &amp; Corporate
          </a>
          <a href="festivals-tours.html" class="block rounded-lg px-3 py-2 hover:bg-white/10">
            Festivals &amp; Tours
          </a>
          <a href="residencies.html" class="block rounded-lg px-3 py-2 hover:bg-white/10">
            Residencies
          </a>
          <a href="brand-activations.html" class="block rounded-lg px-3 py-2 hover:bg-white/10">
            Brand Activations
          </a>
          <a href="collab.html" class="block rounded-lg px-3 py-2 hover:bg-white/10">
            Collaborations
          </a>
        </div>
      </div>

      <!-- Submit Music sits in the nav sequence but keeps the primary emphasis:
           it is one of the site's four core journeys. -->
      <a href="submit.html"
         title="Submit Music for playlist consideration"
         class="btn-primary whitespace-nowrap rounded-xl px-4 py-2 font-semibold">Submit Music</a>
      <a href="media.html">Media</a>
      <a href="https://store.aguocha.com" rel="noopener">Store</a>
    </nav>

    <!-- Right buttons. Tour is no longer a primary nav item; it stays reachable
         from the homepage, from media.html and from the footer. -->
    <div class="hidden items-center gap-2 lg:flex">
      <a href="tel:+17622486242" class="btn rounded-xl px-4 py-2 font-semibold">Call</a>
      <a href="sms:+17622486242" class="btn rounded-xl px-4 py-2 font-semibold">Text</a>
    </div>


    <!-- Mobile nav toggle -->
    <button type="button"
            class="inline-flex rounded-lg border border-white/15 px-3 py-2 lg:hidden"
            data-nav-toggle
            aria-controls="mobile-nav"
            aria-expanded="false"
            aria-label="Menu">
      <span class="font-mono text-lg" aria-hidden="true">≡</span>
    </button>
  </div>

  <!-- MOBILE NAV -->
  <div id="mobile-nav" class="hidden border-t border-white/10 bg-black/60 lg:hidden">
    <nav class="mx-auto grid max-w-7xl gap-3 px-4 py-4 text-lg" aria-label="Primary (mobile)">
      <a href="music.html" data-nav-close>Music</a>

      <!-- Book submenu (mobile only). Same five destinations as desktop. -->
      <a href="book.html" data-nav-close>Book</a>
      <div class="ml-4 grid gap-2 text-base text-white/90">
        <a href="private-corporate.html" data-nav-close>Private &amp; Corporate</a>
        <a href="festivals-tours.html" data-nav-close>Festivals &amp; Tours</a>
        <a href="residencies.html" data-nav-close>Residencies</a>
        <a href="brand-activations.html" data-nav-close>Brand Activations</a>
        <a href="collab.html" data-nav-close>Collaborations</a>
      </div>

      <a href="submit.html" data-nav-close>Submit Music</a>
      <a href="media.html" data-nav-close>Media</a>
      <a href="https://store.aguocha.com" rel="noopener" data-nav-close>Store</a>

      <!-- Contact Buttons -->
      <div class="flex gap-2 pt-2">
        <a href="tel:+17622486242" class="btn w-full rounded-xl px-4 py-2 text-center font-semibold" data-nav-close>Call</a>
        <a href="sms:+17622486242" class="btn w-full rounded-xl px-4 py-2 text-center font-semibold" data-nav-close>Text</a>
      </div>
    </nav>
  </div>
</header>
