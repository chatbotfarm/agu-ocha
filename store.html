<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- EDITORIAL REVIEW REQUIRED: provisional metadata. -->
  <title>Store — Agu Ocha</title>
  <meta name="description" content="Official merch and tickets.">
  <link rel="canonical" href="https://aguocha.com/store.html">
  <link rel="icon" href="favicon.ico">
  <link rel="apple-touch-icon" href="img/agu-logo.png">
  <meta property="og:title" content="Store — Agu Ocha">
  <meta property="og:description" content="Official merch and tickets.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://aguocha.com/store.html">
  <meta property="og:image" content="https://aguocha.com/img/agu-logo.png">
  <link rel="stylesheet" href="assets/site.css">
  <style>
    :root{--jet:#0B0B0C;--ink:#111114;--leopard:#F7F7F8;--steel:#B5B8BE;--brand:#D41414}
    html{font-size:17px}
    @media(min-width:1024px){html{font-size:18px}}
    body{background:var(--jet);color:var(--leopard);line-height:1.65}
    .btn{border:1px solid rgba(255,255,255,0.15);background:transparent;color:var(--leopard);transition:all .2s ease}
    .btn:hover{background:var(--leopard);color:var(--jet)}
    .btn-primary{background:var(--brand);color:var(--leopard);border-color:transparent}
    .btn-primary:hover{background:var(--leopard);color:var(--jet)}
    .card{background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.08)}
    .lead{font-size:1.125rem}
    .section{padding-top:4rem;padding-bottom:4rem}
    .container{max-width:72rem}
    /* Reserve the injected header height so the fetch does not shift the page (CLS). */
    #site-header{min-height:84px}
  </style>
  <!-- Compiled Tailwind. Loaded LAST on purpose: the Play CDN this replaced
       appended its generated stylesheet to the end of <head>, so utilities won
       every specificity tie against the project classes above. That is also
       Tailwind's intended cascade — `class="section pt-10"` is written
       expecting pt-10 to win. Moving this link higher silently changes
       line-height, section padding and card borders sitewide. -->
  <link rel="stylesheet" href="assets/tailwind.css">
</head>
<body>
  <!-- Shared header include -->
  <div id="site-header"></div>

  <main>
    <!-- ==================================================== 1. HERO (D7) -->
    <section class="section pb-8">
      <div class="mx-auto container px-4">
        <h1 class="font-extrabold tracking-tight text-3xl md:text-4xl">Store</h1>
        <!-- EDITORIAL REVIEW REQUIRED: existing description, retained verbatim.
             No products, prices, or stock claims are stated — the store itself
             is external and is not recreated here. -->
        <p class="lead mt-4 max-w-3xl text-white/85">Shop official merch and tickets.</p>
      </div>
    </section>

    <!-- ============================================ 2. PRIMARY CTA (D7) --
         External store destination, unchanged. -->
    <section class="mx-auto container px-4">
      <div class="card rounded-2xl p-6">
        <h2 class="font-bold text-xl">Official store</h2>
        <p class="mt-2 max-w-3xl text-white/80">
          Merch and tickets are sold on the official store, on its own site.
        </p>
        <div class="mt-5 flex flex-wrap gap-3">
          <a class="btn-primary rounded-xl px-5 py-3 font-semibold" href="https://store.aguocha.com" rel="noopener">Go to store.aguocha.com</a>
        </div>
      </div>
    </section>

    <!-- ======================================= 3. CONTACT FALLBACK (D7) -->
    <section class="section">
      <div class="mx-auto container px-4">
        <div class="card rounded-2xl p-6">
          <h2 class="font-bold text-xl">Store not loading?</h2>
          <p class="mt-2 text-white/80">
            Call or text about an order, and the Tour page carries ticket updates.
          </p>
          <div class="mt-5 flex flex-wrap gap-3">
            <a href="tel:+17622486242" class="btn-primary rounded-xl px-5 py-3 font-semibold">Call</a>
            <a href="sms:+17622486242" class="btn rounded-xl px-5 py-3 font-semibold">Text</a>
            <a href="tour.html" class="btn rounded-xl px-5 py-3 font-semibold">Tour</a>
          </div>
        </div>
      </div>
    </section>
  </main>

  <!-- Shared footer include -->
  <div id="site-footer"></div>

  <!-- Shared header/footer loader + nav behavior -->
  <script src="assets/site.js" defer></script>
</body>
</html>
