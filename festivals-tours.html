    /* Preserves the query string and fragment. Both come from location, which
       is assigned to location.replace() — never written into the document — so
       nothing untrusted is interpolated into HTML. */
    location.replace("/booking/festivals-tours/" + location.search + location.hash);
  </script>
</head>
